name: Build Compass

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compile AnyCPU executable
        shell: pwsh
        run: .\build.ps1 -OutputDirectory .\dist

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Compass-x64-x86
          path: 'dist/Compass x64_x86.exe'
          if-no-files-found: error
