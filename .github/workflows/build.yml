name: Build Compass

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compile AnyCPU executable
        shell: pwsh
        run: .\build.ps1 -OutputDirectory .\dist

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Compass-x64-x86
          path: 'dist/Compass x64_x86.exe'
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: Compass-x64-x86
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Win桌面罗盘 ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: 'dist/Compass x64_x86.exe'
